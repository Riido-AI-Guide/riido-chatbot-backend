spring:
  application:
    name: riido-chatbot-backend
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
        format_sql: true

server:
  port: 8080

app:
  ai:
    base-url: http://localhost:8000
    connect-timeout: 5s
    read-timeout: 60s
  cors:
    allowed-origin: http://localhost:5173