# Azure 배포용 프로파일
# 경로: src/main/resources/application-prod.yaml
#
# 값이 하나도 안 들어있어서 그대로 커밋해도 안전합니다.
# 실제 값은 Azure Container Apps의 환경변수에서 옵니다.
#
# ${VAR} 는 "환경변수 VAR 값을 여기 넣어라"는 뜻이고,
# ${VAR:기본값} 은 "VAR 가 없으면 기본값을 쓰라"는 뜻입니다.

spring:
  datasource:
    # ⚠️ Supabase 무료 플랜의 직접 연결(db.xxx.supabase.co:5432)은 IPv6 전용입니다.
    # Azure Container Apps는 IPv6로 나갈 수 없어서 연결이 안 됩니다.
    # 반드시 Session pooler 주소를 쓰세요 (자세한 건 DEPLOY.md 4단계).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      # pooler를 거치면 연결이 끊기는 경우가 있어 짧게 잡습니다.
      max-lifetime: 240000          # 4분
      connection-timeout: 10000     # 10초

  jpa:
    hibernate:
      # 데모 단계라 update로 둡니다.
      # 실서비스로 가면 validate로 바꾸고 스키마는 마이그레이션 도구로 관리하세요.
      ddl-auto: update
    show-sql: false                 # 운영에선 끕니다. 로그가 SQL로 도배됩니다
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
        format_sql: false

server:
  port: ${PORT:8080}                # Container Apps가 PORT로 포트를 넘겨줍니다

app:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 5s
    # FastAPI가 잠들어 있다가 깨어나는 시간(콜드 스타트)을 감안해 넉넉히 둡니다.
    read-timeout: 60s
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
